version: 2

models:
  - name: dim_stations
    columns:
      - name: station_id
        tests: [unique, not_null]

  - name: dim_date
    columns:
      - name: date_day
        tests: [unique, not_null]

  - name: fct_trips
    columns:
      - name: ride_id
        tests: [unique, not_null]
      - name: start_station_id
        tests:
          - relationships:
              to: ref('dim_stations')
              field: station_id
      - name: started_date
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_day